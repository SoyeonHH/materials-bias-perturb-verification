<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* ─── Constants ─── */
const STORAGE_PREFIX = "pv2_";

const TYPE_COLORS = {
  numerical_perturbation: { bg:"#fef3c7", border:"#f59e0b", text:"#92400e", label:"수치" },
  element_substitution:   { bg:"#dbeafe", border:"#3b82f6", text:"#1e40af", label:"원소" },
  equipment_substitution: { bg:"#f3e8ff", border:"#a855f7", text:"#6b21a8", label:"장비" },
  action_antonym:         { bg:"#ffe4e6", border:"#f43f5e", text:"#9f1239", label:"Action" },
  to_formula:             { bg:"#d1fae5", border:"#10b981", text:"#065f46", label:"Formula" },
  to_name:                { bg:"#cffafe", border:"#06b6d4", text:"#155e75", label:"Name" },
  to_iupac:               { bg:"#e0e7ff", border:"#6366f1", text:"#3730a3", label:"IUPAC" },
};

const DOMAIN_COLORS = {
  Energy:        { bg:"#fef9c3", border:"#eab308", text:"#854d0e" },
  Electronics:   { bg:"#dbeafe", border:"#3b82f6", text:"#1e40af" },
  Environmental: { bg:"#dcfce7", border:"#22c55e", text:"#166534" },
  Healthcare:    { bg:"#fce7f3", border:"#ec4899", text:"#9d174d" },
  Others:        { bg:"#f3f4f6", border:"#9ca3af", text:"#4b5563" },
};

const VERDICT_STYLES = {
  O: { bg:"#dc2626", label:"O Yes — 문제 있음" },
  X: { bg:"#059669", label:"X No — 문제 없음" },
};

const QUESTION = "이 변경이 레시피에 과학적 문제를 일으키는가?";

/* ─── Seeded shuffle ─── */
function seededShuffle(arr, seed) {
  const a = arr.slice();
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = ((h << 5) - h + seed.charCodeAt(i)) | 0; }
  let s = Math.abs(h) || 1;
  const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ─── Storage helpers ─── */
function getDataId(data) {
  const s = data.map(d => d.sample_id + "|" + d.perturbation_type).join(",");
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return "d" + Math.abs(h).toString(36);
}

function loadSaved(dataId) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + dataId);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveToDisk(dataId, annotations, logs, annotatorId) {
  try {
    localStorage.setItem(STORAGE_PREFIX + dataId, JSON.stringify({ annotations, logs, annotatorId, savedAt: new Date().toISOString() }));
  } catch(e) { console.warn("localStorage save failed", e); }
}

/* ─── DataLoader ─── */
function DataLoader({ onLoad }) {
  const [name, setName] = useState("");
  const [err, setErr] = useState("");
  const [url, setUrl] = useState("");
  const [loading, setLoading] = useState(false);
  const [savedInfo, setSavedInfo] = useState(null);
  const [loadedData, setLoadedData] = useState(null);
  const dropRef = useRef(null);
  const fileRef = useRef(null);

  // Auto-load: fetch external annotation_data.json
  useEffect(() => {
    setLoading(true);
    fetch("annotation_data.json?v=" + Date.now())
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { processData(d, "auto"); setLoading(false); })
      .catch(() => { setLoading(false); }); // silent fail — user can upload manually
  }, []);

  const processData = (raw, source) => {
    try {
      let data = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (!Array.isArray(data) || data.length === 0) throw new Error("빈 배열");
      if (!data[0].segments || !data[0].changes) throw new Error("segments/changes 필드 없음");
      // Filter out to_cas samples and changes
      data = data.filter(d => d.perturbation_type !== "llm_to_cas");
      data.forEach(d => { d.changes = d.changes.filter(c => c.source_type !== "to_cas"); });
      data = data.filter(d => d.changes.length > 0);
      data.forEach((d, i) => { d._origIdx = i; });

      // Fix segment alignment: rebuild segments by searching for each
      // replacement in the perturbed text. Uses ALL occurrences of each
      // replacement to guarantee every change gets a highlight.
      data.forEach(d => {
        const fullText = d.segments.map(s => s.content).join('');
        const fullLower = fullText.toLowerCase();
        const sorted = d.changes.map((ch, i) => ({ ...ch, _idx: i }))
          .filter(ch => ch.position != null && ch.position >= 0)
          .sort((a, b) => a.position - b.position);
        if (sorted.length === 0) {
          // No position data — keep original segments, mark existing change segments as highlighted
          const highlightedSet = new Set();
          d.segments.forEach(seg => { if (seg.type === 'change' && seg.change_idx != null) highlightedSet.add(seg.change_idx); });
          d._highlightedChanges = highlightedSet;
          return;
        }

        // Find ALL occurrences for each replacement, then greedily assign
        // each change to the best (closest to cursor) unused occurrence.
        const allOccurrences = []; // { start, end, changeIdx }
        const used = new Set(); // track used text positions
        for (const ch of sorted) {
          const rep = ch.replacement;
          const repLower = rep.toLowerCase();
          // Collect all positions of this replacement in text
          const positions = [];
          let searchFrom = 0;
          while (true) {
            let idx = fullText.indexOf(rep, searchFrom);
            if (idx >= 0) { positions.push({ pos: idx, exact: true }); searchFrom = idx + 1; continue; }
            break;
          }
          // Also case-insensitive positions
          searchFrom = 0;
          while (true) {
            let idx = fullLower.indexOf(repLower, searchFrom);
            if (idx >= 0) {
              if (!positions.some(p => p.pos === idx)) positions.push({ pos: idx, exact: false });
              searchFrom = idx + 1; continue;
            }
            break;
          }
          // Pick the best unused position (prefer exact, closest to position hint)
          positions.sort((a, b) => {
            if (a.exact !== b.exact) return a.exact ? -1 : 1;
            return Math.abs(a.pos - (ch.position || 0)) - Math.abs(b.pos - (ch.position || 0));
          });
          let picked = null;
          for (const p of positions) {
            const key = `${p.pos}-${p.pos + rep.length}`;
            if (!used.has(key)) { picked = p; used.add(key); break; }
          }
          if (picked != null) {
            allOccurrences.push({ start: picked.pos, end: picked.pos + rep.length, changeIdx: ch._idx });
          }
        }

        // Sort by position and build segments
        allOccurrences.sort((a, b) => a.start - b.start);
        const newSegs = [];
        let cursor = 0;
        for (const occ of allOccurrences) {
          if (occ.start < cursor) continue; // overlapping, skip
          if (occ.start > cursor) newSegs.push({ type: 'text', content: fullText.slice(cursor, occ.start) });
          newSegs.push({ type: 'change', content: fullText.slice(occ.start, occ.end), change_idx: occ.changeIdx });
          cursor = occ.end;
        }
        if (cursor < fullText.length) newSegs.push({ type: 'text', content: fullText.slice(cursor) });
        d.segments = newSegs;

        // Track which change indices got a highlight
        const highlightedSet = new Set(allOccurrences.map(o => o.changeIdx));
        d._highlightedChanges = highlightedSet;
      });

      // Generate decoy changes for attention verification
      // Group samples by perturbation_type for cross-sample fallback
      const byType = {};
      data.forEach(d => {
        if (!byType[d.perturbation_type]) byType[d.perturbation_type] = [];
        byType[d.perturbation_type].push(d);
      });
      data.forEach(d => {
        const isError = d.perturbation_category === "error";
        const origLen = d.changes.length;
        const decoys = [];
        if (!isError) {
          // RP decoy: pair with a different change's replacement (different substance)
          // Must ensure decoy replacement refers to a DIFFERENT substance than ch.original
          const half = Math.ceil(origLen / 2);
          d.changes.forEach((ch, i) => {
            let otherReplacement = null;
            // Try cross-pair: compare originals to ensure different compound
            const otherIdx = (i + half) % origLen;
            if (origLen > 1 && d.changes[otherIdx].original !== ch.original) {
              otherReplacement = d.changes[otherIdx].replacement;
            }
            // Fallback: try other indices in same sample
            if (!otherReplacement) {
              for (let k = 1; k < origLen; k++) {
                const tryIdx = (i + k) % origLen;
                if (d.changes[tryIdx].original !== ch.original) {
                  otherReplacement = d.changes[tryIdx].replacement;
                  break;
                }
              }
            }
            // Fallback: find from another sample of same type (filter out decoys)
            if (!otherReplacement) {
              const siblings = (byType[d.perturbation_type] || []).filter(s => s !== d);
              for (let k = 0; k < siblings.length && !otherReplacement; k++) {
                const sib = siblings[(i + k) % siblings.length];
                const sibOrig = sib.changes.filter(c => !c._isDecoy && c.original !== ch.original);
                if (sibOrig.length > 0) {
                  otherReplacement = sibOrig[i % sibOrig.length].replacement;
                }
              }
            }
            if (otherReplacement && otherReplacement !== ch.original) {
              decoys.push({ original: ch.original, replacement: otherReplacement, source_type: ch.source_type, _isDecoy: true });
            }
          });
        }
        d.changes.push(...decoys);

        // Filter change list to only include changes that have highlights
        // (decoys and unmatched changes are excluded from display).
        // Keep original indices intact by building a filtered display order.
        const highlightedSet = d._highlightedChanges || new Set();
        // For decoys, they don't have highlights, so they are excluded.
        // Build display order from only highlighted change indices.
        const visibleIndices = [];
        for (let i = 0; i < d.changes.length; i++) {
          if (highlightedSet.has(i)) visibleIndices.push(i);
        }
        d._displayOrder = seededShuffle(visibleIndices, String(d.sample_id || d._origIdx));
      });

      setLoadedData(data);
      setErr("");
      const id = getDataId(data);
      const saved = loadSaved(id);
      if (saved && Object.keys(saved.annotations || {}).length > 0) {
        setSavedInfo({ ...saved, dataId: id, count: Object.keys(saved.annotations).filter(k => saved.annotations[k]).length });
      }
    } catch(e) { setErr("데이터 파싱 오류: " + e.message); }
  };

  const handleFile = (file) => {
    if (!file) return;
    setLoading(true);
    const reader = new FileReader();
    reader.onload = (e) => { processData(e.target.result, file.name); setLoading(false); };
    reader.onerror = () => { setErr("파일 읽기 실패"); setLoading(false); };
    reader.readAsText(file);
  };

  const handleUrl = () => {
    if (!url.trim()) return;
    setLoading(true);
    fetch(url.trim())
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { processData(d, url); setLoading(false); })
      .catch(e => { setErr("URL 로드 실패: " + e.message); setLoading(false); });
  };

  const handleStart = (resumeSaved) => {
    if (!loadedData || !name.trim()) return;
    const dataId = getDataId(loadedData);
    const saved = resumeSaved && savedInfo ? savedInfo : null;
    onLoad({
      data: seededShuffle(loadedData, name.trim()),
      annotatorId: name.trim(),
      dataId,
      resumeAnnotations: saved ? saved.annotations : {},
      resumeLogs: saved ? saved.logs : [],
    });
  };

  return (
    <div className="loader-bg">
      <div className="loader-card">
        <h1>Perturbation Human Verification</h1>
        <p>합성 레시피의 자동 변경사항을 검증합니다.</p>

        <div className="loader-field">
          <label>평가자 이름 (필수)</label>
          <input placeholder="예: 홍길동" value={name} onChange={e => setName(e.target.value)} />
        </div>

        {loadedData ? (
          <div className="loader-field">
            <div style={{padding:"14px",background:"#ecfdf5",border:"1px solid #a7f3d0",borderRadius:"8px",fontSize:"13px",color:"#065f46"}}>
              ✅ {loadedData.length}개 샘플, {loadedData.reduce((s,d)=>s+(d._displayOrder||d.changes.map((_,i)=>i)).length,0)}개 변경사항 로드됨
            </div>
          </div>
        ) : (
          <div className="loader-field">
            <label>Annotation 데이터 (JSON)</label>
            {loading ? (
              <div style={{padding:"14px",textAlign:"center",color:"#888",fontSize:"12px"}}>데이터 로딩 중...</div>
            ) : (
              <>
                <div
                  ref={dropRef}
                  className="loader-drop"
                  onClick={() => fileRef.current?.click()}
                  onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add("drag"); }}
                  onDragLeave={e => e.currentTarget.classList.remove("drag")}
                  onDrop={e => { e.preventDefault(); e.currentTarget.classList.remove("drag"); handleFile(e.dataTransfer.files[0]); }}
                >
                  <div className="icon">📂</div>
                  <p>JSON 파일을 드래그하거나 클릭하여 업로드</p>
                  <input ref={fileRef} type="file" accept=".json" hidden onChange={e => handleFile(e.target.files[0])} />
                </div>
                <div className="loader-or">— 또는 URL로 로드 —</div>
                <div className="loader-url">
                  <input placeholder="https://...annotation_data.json" value={url} onChange={e => setUrl(e.target.value)} />
                  <button onClick={handleUrl} disabled={loading}>로드</button>
                </div>
              </>
            )}
          </div>
        )}

        {err && <div className="loader-err">{err}</div>}

        {savedInfo && (
          <div className="loader-resume">
            <strong>이전 작업 발견</strong> — {savedInfo.annotatorId}, {savedInfo.count}개 완료 ({savedInfo.savedAt?.slice(0,16)})
            <br/>
            <button onClick={() => { setName(savedInfo.annotatorId || name); handleStart(true); }}>이어서 하기</button>
          </div>
        )}

        <button className="loader-start" disabled={!loadedData || !name.trim()} onClick={() => handleStart(false)}>
          {loadedData ? `시작하기 (${loadedData.length}개 샘플)` : "데이터를 먼저 로드하세요"}
        </button>
      </div>
    </div>
  );
}

/* ─── Gold Tutorial ─── */
function GoldTutorial({ goldItems, onComplete }) {
  const [idx, setIdx] = useState(0);
  if (!goldItems || goldItems.length === 0) { onComplete(); return null; }
  const item = goldItems[idx];
  return (
    <div className="gold-bg">
      <div className="gold-card">
        <h2>판단 기준 예시</h2>
        <div className="gold-sub">아래 예시를 확인한 후 본 평가를 시작합니다. ({idx+1}/{goldItems.length})</div>

        {goldItems.map((g, gi) => (
          <div key={gi} className="gold-item" style={{ display: gi === idx ? "block" : "none" }}>
            <span className="gi-type" style={{ background: (TYPE_COLORS[g.source_type]||TYPE_COLORS.numerical_perturbation).bg }}>
              {(TYPE_COLORS[g.source_type]||TYPE_COLORS.numerical_perturbation).label}
            </span>
            <div className="gi-diff">
              <span className="gi-orig">{g.original}</span>
              <span className="gi-arrow">→</span>
              <span className="gi-rep">{g.replacement}</span>
            </div>
            {g.context && <div className="gi-ctx">"{g.context}"</div>}
            <div className="gi-answer">
              정답:
              <span className={g.gold_verdict === "O" ? "badge-o" : "badge-x"}>{g.gold_verdict}</span>
              {g.gold_verdict === "O" ? "문제 있음" : "문제 없음"}
            </div>
            <div className="gi-reason">{g.gold_reason}</div>
          </div>
        ))}

        <button className="gold-next" onClick={() => idx < goldItems.length - 1 ? setIdx(idx+1) : onComplete()}>
          {idx < goldItems.length - 1 ? `다음 예시 →` : "본 평가 시작하기"}
        </button>
      </div>
    </div>
  );
}

/* ─── Popover ─── */
function Popover({ change, changeIdx, annotation, onAnnotate, onClose, anchorRect }) {
  const ref = useRef(null);
  const tc = TYPE_COLORS[change.source_type] || TYPE_COLORS.numerical_perturbation;

  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [onClose]);

  const style = {
    top: Math.min(anchorRect ? anchorRect.bottom + 8 : 200, window.innerHeight - 320),
    left: Math.min(Math.max(anchorRect ? anchorRect.left : 200, 10), window.innerWidth - 380),
  };

  return (
    <div className="popover" ref={ref} style={style}>
      <div className="pop-header">
        <span className="pop-badge" style={{ background: tc.bg, color: tc.text, borderColor: tc.border }}>{tc.label}</span>
        <span className="pop-idx">Change #{changeIdx + 1}</span>
        <button className="pop-close" onClick={onClose}>✕</button>
      </div>
      <div className="pop-diff">
        <div className="pop-diff-item">
          <span className="pop-diff-label">Original</span>
          <span className="pop-diff-val original-val">{change.original}</span>
        </div>
        <div className="pop-diff-arrow">→</div>
        <div className="pop-diff-item">
          <span className="pop-diff-label">Perturbed</span>
          <span className="pop-diff-val perturbed-val">{change.replacement}</span>
        </div>
      </div>
      {(change.multiplier || change.antonym_pair || change.element_group || change.lookup_source) && (
        <div className="pop-meta">
          {change.multiplier && <span>배율: x{change.multiplier}</span>}
          {change.unit_type && <span>단위: {change.unit_type}</span>}
          {change.antonym_pair && <span>쌍: {change.antonym_pair}</span>}
          {change.element_group && <span>족: {change.element_group}</span>}
          {change.lookup_source && <span>출처: {change.lookup_source}</span>}
        </div>
      )}
      <div className="pop-question">{QUESTION}</div>
      <div className="pop-buttons">
        {["O", "X"].map(v => (
          <button
            key={v}
            className={`pop-btn ${annotation === v ? "active" : ""}`}
            style={annotation === v ? { background: VERDICT_STYLES[v].bg, color:"#fff", borderColor: VERDICT_STYLES[v].bg } : {}}
            onClick={() => onAnnotate(v)}
          >
            {VERDICT_STYLES[v].label}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ─── RecipeView ─── */
function RecipeView({ segments, changes, annotations, onAnnotate, focusedChange, onFocusChange }) {
  const [activeChange, setActiveChange] = useState(null);
  const [anchorRect, setAnchorRect] = useState(null);

  // Reset active state when sample changes
  useEffect(() => { setActiveChange(null); setAnchorRect(null); }, [segments]);

  // Scroll to highlight when focusedChange changes (from change list click)
  useEffect(() => {
    if (focusedChange == null) return;
    const el = document.querySelector(`[data-change-idx="${focusedChange}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setActiveChange(focusedChange);
      setAnchorRect(el.getBoundingClientRect());
    }
  }, [focusedChange]);

  return (
    <div className="recipe-view">
      <div className="recipe-text">
        {segments.map((seg, i) => {
          if (seg.type === "text") return <span key={i}>{seg.content}</span>;
          const ci = seg.change_idx;
          const ch = changes[ci];
          const tc = TYPE_COLORS[ch.source_type] || TYPE_COLORS.numerical_perturbation;
          const ann = annotations[ci];
          const vd = ann ? VERDICT_STYLES[ann] : null;
          return (
            <span
              key={i}
              data-change-idx={ci}
              className={`highlight ${activeChange === ci ? "highlight-active" : ""}`}
              style={{ backgroundColor: tc.bg, borderBottom: `2px solid ${tc.border}` }}
              onClick={e => { setAnchorRect(e.target.getBoundingClientRect()); setActiveChange(activeChange === ci ? null : ci); if (onFocusChange) onFocusChange(null); }}
              title={`${ch.original} → ${ch.replacement}`}
            >
              {seg.content}
              {vd && <span className="verdict-dot" style={{ backgroundColor: vd.bg }} />}
            </span>
          );
        })}
      </div>
      {activeChange !== null && (
        <Popover
          change={changes[activeChange]}
          changeIdx={activeChange}
          annotation={annotations[activeChange]}
          onAnnotate={v => onAnnotate(activeChange, v)}
          onClose={() => setActiveChange(null)}
          anchorRect={anchorRect}
        />
      )}
    </div>
  );
}

/* ─── ChangeList ─── */
function ChangeList({ changes, annotations, onAnnotate, displayOrder, onClickChange }) {
  const order = displayOrder || changes.map((_, i) => i);
  return (
    <div className="change-list">
      <div className="cl-title">변경 목록 ({order.length})</div>
      {order.map((idx, dispIdx) => {
        const ch = changes[idx];
        if (!ch) return null;
        const tc = TYPE_COLORS[ch.source_type] || TYPE_COLORS.numerical_perturbation;
        const ann = annotations[idx];
        return (
          <div key={idx} className={`cl-item ${ann ? "cl-done" : ""}`}
            onClick={() => onClickChange && onClickChange(idx)}>
            <div className="cl-item-top">
              <span className="cl-idx">#{dispIdx+1}</span>
              <span className="cl-badge" style={{ background: tc.bg, color: tc.text, fontSize:10 }}>{tc.label}</span>
              {ann && <span className="cl-verdict" style={{ background: VERDICT_STYLES[ann].bg }}>{ann}</span>}
            </div>
            <div className="cl-diff">
              <span className="cl-orig">{ch.original}</span>
              <span className="cl-arrow">→</span>
              <span className="cl-rep">{ch.replacement}</span>
            </div>
            <div className="cl-quick-btns">
              {["O","X"].map(v => (
                <button key={v} className={`cl-quick-btn btn-${v.toLowerCase()}`}
                  style={ann === v ? { background: VERDICT_STYLES[v].bg === "#dc2626" ? "#fef2f2" : "#ecfdf5", borderColor: VERDICT_STYLES[v].bg, fontWeight:700 } : {}}
                  onClick={e => { e.stopPropagation(); onAnnotate(idx, v); }}>
                  {v === "O" ? "⭕" : "❌"} {VERDICT_STYLES[v].label.slice(2)}
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Main App ─── */
function App() {
  const [appData, setAppData] = useState(null);   // { data, annotatorId, dataId, ... }
  const [sampleIdx, setSampleIdx] = useState(0);
  const [annotations, setAnnotations] = useState({});
  const [logs, setLogs] = useState([]);
  const [showOriginal, setShowOriginal] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showContribution, setShowContribution] = useState(false);
  const [exportTab, setExportTab] = useState("annotations");
  const [focusedChange, setFocusedChange] = useState(null);
  const [goldDone, setGoldDone] = useState({});  // { error: bool, representational: bool }
  const saveTimer = useRef(null);

  /* ─ Data loaded callback ─ */
  const handleDataLoaded = (info) => {
    setAppData(info);
    setAnnotations(info.resumeAnnotations || {});
    setLogs(info.resumeLogs || []);
    addLog(info.resumeLogs || [], "session_start", {}, info);
  };

  /* ─ Logging ─ */
  const addLog = (currentLogs, type, detail, infoOverride) => {
    const entry = { timestamp: new Date().toISOString(), type, ...detail };
    const next = [...(currentLogs || logs), entry];
    setLogs(next);
    return next;
  };

  /* ─ Auto-save ─ */
  useEffect(() => {
    if (!appData) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveToDisk(appData.dataId, annotations, logs, appData.annotatorId);
    }, 2000);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [annotations, logs, appData]);

  /* ─ Keyboard shortcuts ─ */
  useEffect(() => {
    if (!appData) return;
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const key = e.key.toUpperCase();
      if (key === "O" || key === "X" || key === "ㅐ" || key === "ㅌ") {
        // Find first unannotated change in current sample
        const sample = appData.data[sampleIdx];
        if (!sample) return;
        const verdict = (key === "O" || key === "ㅐ") ? "O" : "X";
        const order = sample._displayOrder || sample.changes.map((_, i) => i);
        const firstUndoneIdx = order.find(ci => !annotations[`${sample._origIdx}-${ci}`]);
        if (firstUndoneIdx !== undefined) {
          handleAnnotate(firstUndoneIdx, verdict);
        }
      }
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        setSampleIdx(prev => Math.min(prev + 1, appData.data.length - 1));
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        setSampleIdx(prev => Math.max(prev - 1, 0));
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [appData, sampleIdx, annotations]);

  /* ─ Annotation handler ─ */
  const handleAnnotate = (ci, val) => {
    const sample = appData.data[sampleIdx];
    const key = `${sample._origIdx}-${ci}`;
    const prev = annotations[key];
    const next = prev === val ? undefined : val;
    setAnnotations(a => ({ ...a, [key]: next }));
    const newLog = addLog(logs, "annotate", {
      sample_idx: sampleIdx,
      sample_id: sample.sample_id,
      change_idx: ci,
      perturbation_type: sample.perturbation_type,
      original: sample.changes[ci]?.original,
      replacement: sample.changes[ci]?.replacement,
      verdict: next || "cleared",
      prev_verdict: prev || null,
    });
    setLogs(newLog);
  };

  const handleNavigate = (newIdx) => {
    addLog(logs, "navigate", { from: sampleIdx, to: newIdx });
    setSampleIdx(newIdx);
    setFocusedChange(null);
  };

  /* ─ Getters ─ */
  const data = appData?.data || [];
  const sample = data[sampleIdx];
  const getKey = (s, ci) => `${s._origIdx}-${ci}`;
  const category = sample?.perturbation_category || "error";
  const isEP = category === "error";

  const getVisibleIndices = (s) => s._displayOrder || s.changes.map((_, i) => i);

  const sampleAnnotations = useMemo(() => {
    if (!sample) return {};
    const r = {};
    const vis = new Set(getVisibleIndices(sample));
    sample.changes.forEach((_, ci) => { if (vis.has(ci)) { const v = annotations[getKey(sample, ci)]; if (v) r[ci] = v; } });
    return r;
  }, [sample, sampleIdx, annotations]);
  const totalChanges = data.reduce((s, d) => s + getVisibleIndices(d).length, 0);
  const doneCount = data.reduce((s, d) => s + getVisibleIndices(d).filter(ci => annotations[getKey(d, ci)]).length, 0);
  const sampleDone = sample ? getVisibleIndices(sample).filter(ci => annotations[getKey(sample, ci)]).length : 0;
  const totalSamples = data.length;
  const doneSamples = data.filter(s => getVisibleIndices(s).every(ci => annotations[getKey(s, ci)])).length;

  /* ─ Export ─ */
  const buildExport = () => {
    const result = {
      annotator_id: appData.annotatorId,
      completed_at: new Date().toISOString(),
      setting: "reference_free",
      total_displayed: totalChanges,
      total_annotated: doneCount,
      samples: data.map((s, si) => {
        const visSet = new Set(getVisibleIndices(s));
        return {
          sample_id: s.sample_id,
          perturbation_category: s.perturbation_category,
          perturbation_type: s.perturbation_type,
          material: s.material,
          process: s.process,
          domain: s.domain,
          displayed_count: visSet.size,
          annotations: s.changes.map((c, ci) => ({
            change_idx: ci,
            original: c.original,
            replacement: c.replacement,
            source_type: c.source_type,
            lookup_source: c.lookup_source || null,
            verdict: annotations[getKey(s, ci)] || null,
            is_gold: c.is_gold || false,
            is_decoy: c._isDecoy || false,
            was_displayed: visSet.has(ci),
          })),
        };
      }),
    };
    return JSON.stringify(result, null, 2);
  };

  const buildLogExport = () => {
    return JSON.stringify({
      annotator_id: appData.annotatorId,
      session_count: logs.filter(l => l.type === "session_start").length,
      total_actions: logs.length,
      logs,
    }, null, 2);
  };

  const downloadJSON = (content, filename) => {
    const blob = new Blob([content], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  /* ─ Gold tutorial check ─ */
  const goldItemsForCategory = useMemo(() => {
    if (!appData) return [];
    const cats = [...new Set(data.map(d => d.perturbation_category))];
    const currentCat = cats.find(c => !goldDone[c]);
    if (!currentCat) return [];
    const items = [];
    data.forEach(s => {
      if (s.perturbation_category !== currentCat) return;
      s.changes.forEach(ch => {
        if (ch.is_gold && ch.gold_verdict) items.push({ ...ch, category: currentCat });
      });
    });
    return items.length > 0 ? { items, category: currentCat } : null;
  }, [appData, goldDone, data]);

  /* ─ Render stages ─ */
  if (!appData) return <DataLoader onLoad={handleDataLoaded} />;

  if (goldItemsForCategory) {
    return (
      <GoldTutorial
        goldItems={goldItemsForCategory.items}
        onComplete={() => setGoldDone(prev => ({ ...prev, [goldItemsForCategory.category]: true }))}
      />
    );
  }

  if (!sample) return null;

  return (
    <div className="app">
      {/* TOP BAR */}
      <div className="topbar">
        <span className="topbar-title">Perturbation Verification</span>
        <div className="topbar-progress">
          <div className="topbar-bar">
            <div className="topbar-fill" style={{ width: `${totalSamples ? (doneSamples/totalSamples*100) : 0}%` }} />
          </div>
          <span className="topbar-pct">{doneSamples}/{totalSamples} 샘플</span>
        </div>
        <div className="topbar-right">
          <span className="topbar-user">{appData.annotatorId}</span>
          <button className="topbar-btn secondary" onClick={() => { saveToDisk(appData.dataId, annotations, logs, appData.annotatorId); alert("저장 완료"); }}>저장</button>
          <button className="topbar-btn" onClick={() => {
            const incompleteIdx = data.findIndex(s => getVisibleIndices(s).some(ci => !annotations[getKey(s, ci)]));
            if (incompleteIdx >= 0) {
              handleNavigate(incompleteIdx);
              alert(`미완료 샘플이 있습니다. (#${data[incompleteIdx].sample_id})`);
            } else {
              addLog(logs, "export_open", {}); setShowExport(true);
            }
          }}>Export</button>
        </div>
      </div>

      {/* CONTEXT BAR */}
      <div className="context-bar">
        <span className="ctx-material" title={sample.material}>{sample.material}</span>
        <span className="ctx-tag">{sample.process}</span>
        <span className="ctx-tag" style={(()=>{ const dc = DOMAIN_COLORS[sample.domain] || DOMAIN_COLORS.Others; return {background:dc.bg,color:dc.text,border:`1px solid ${dc.border}`}; })()}>{sample.domain}</span>
        <span className="ctx-changes"><strong>{sampleDone}</strong> / {getVisibleIndices(sample).length} annotated</span>
        <button className={`ref-toggle ${showOriginal ? "active" : ""}`} onClick={() => setShowOriginal(!showOriginal)}>
          {showOriginal ? "원본 닫기" : "원본 레시피 보기"}
        </button>
      </div>

      {/* MAIN */}
      <div className="main-layout">
        {/* LEFT NAV */}
        <div className="sample-nav">
          <div className="nav-label">Samples</div>
          {data.map((s, i) => {
            const vis = getVisibleIndices(s);
            const d = vis.filter(ci => annotations[getKey(s, ci)]).length;
            const p = Math.round((d / vis.length) * 100);
            return (
              <div key={i} className={`nav-item ${i === sampleIdx ? "active" : ""}`} onClick={() => handleNavigate(i)}>
                <div className="nav-item-top">
                  <span className="nav-id">#{s.sample_id}</span>
                </div>
                <div className="nav-mat">{s.material}</div>
                {s.domain && <span className="ctx-tag" style={(()=>{ const dc = DOMAIN_COLORS[s.domain] || DOMAIN_COLORS.Others; return {background:dc.bg,color:dc.text,border:`1px solid ${dc.border}`,fontSize:"9px",padding:"1px 5px",marginTop:"3px",display:"inline-block"}; })()}>{s.domain}</span>}
                <div className="nav-prog">
                  <div className="nav-prog-fill" style={{ width: `${p}%` }} />
                </div>
              </div>
            );
          })}
        </div>

        {/* CENTER */}
        <div className="recipe-panel">
          <button className="contribution-toggle" onClick={() => setShowContribution(!showContribution)}>
            {showContribution ? "▲ Input Context 접기" : "▼ Input Context 보기"}
          </button>
          {showContribution && (
            <div className="contribution-section">
              <strong>Input Context (Target)</strong>
              <div style={{ marginTop: 6, whiteSpace: "pre-wrap" }}>{sample.contribution}</div>
            </div>
          )}

          <div className="legend">
            {Object.entries(TYPE_COLORS).map(([k, v]) => (
              <div className="legend-item" key={k}>
                <div className="legend-swatch" style={{ backgroundColor: v.bg, borderColor: v.border }} />
                {v.label}
              </div>
            ))}
          </div>

          <RecipeView
            segments={sample.segments}
            changes={sample.changes}
            annotations={sampleAnnotations}
            onAnnotate={handleAnnotate}
            focusedChange={focusedChange}
            onFocusChange={setFocusedChange}
          />
        </div>

        {/* RIGHT PANEL */}
        <div className="right-panel">
          <div className="question-box">
            <div className="q-text">{QUESTION}</div>
            <div className="q-legend">
              <span style={{color:"#dc2626"}}>O = Yes, 문제 있음 (과학적 타당성 훼손)</span>
              <span style={{color:"#059669"}}>X = No, 문제 없음 (타당성 유지)</span>
            </div>
          </div>
          <ChangeList
            changes={sample.changes}
            annotations={sampleAnnotations}
            onAnnotate={handleAnnotate}
            displayOrder={sample._displayOrder}
            onClickChange={setFocusedChange}
          />
        </div>
      </div>

      {/* ORIGINAL OVERLAY */}
      {showOriginal && (
        <div className="original-overlay">
          <div className="orig-header">
            <h3>Original Recipe</h3>
            <button className="orig-close" onClick={() => setShowOriginal(false)}>✕</button>
          </div>
          <div className="orig-body">{sample.original_recipe}</div>
        </div>
      )}

      {/* EXPORT MODAL */}
      {showExport && (
        <div className="modal-bg" onClick={() => setShowExport(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3>Export</h3>
            <p style={{ fontSize:12, color:"#666", marginBottom:8 }}>
              {appData.annotatorId} · {doneSamples}/{totalSamples} 샘플 완료 · 로그 {logs.length}건
            </p>
            <div className="modal-tabs">
              <div className={`modal-tab ${exportTab === "annotations" ? "active" : ""}`} onClick={() => setExportTab("annotations")}>Annotations</div>
              <div className={`modal-tab ${exportTab === "logs" ? "active" : ""}`} onClick={() => setExportTab("logs")}>Action Logs</div>
            </div>
            <textarea readOnly value={exportTab === "annotations" ? buildExport() : buildLogExport()} />
            <div className="modal-actions">
              <button onClick={() => setShowExport(false)}>닫기</button>
              <button onClick={() => navigator.clipboard.writeText(exportTab === "annotations" ? buildExport() : buildLogExport())}>클립보드 복사</button>
              <button className="primary" onClick={() => {
                const isAnn = exportTab === "annotations";
                const content = isAnn ? buildExport() : buildLogExport();
                const fname = `${isAnn ? "annotations" : "logs"}_${appData.annotatorId}_${new Date().toISOString().slice(0,10)}.json`;
                downloadJSON(content, fname);
              }}>JSON 다운로드</button>
            </div>
          </div>
        </div>
      )}

      {/* KEYBOARD HINT */}
      <div className="kbd-hint">
        <span><kbd>O</kbd> Yes (문제 있음)</span>
        <span><kbd>X</kbd> No (문제 없음)</span>
        <span><kbd>←</kbd><kbd>→</kbd> 샘플 이동</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
